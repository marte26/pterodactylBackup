# copy to app.yaml next to the pterodactylBackup executable
api_key: ptla_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
base_url: https://panel.example.com
# debug, info, warn or error, defaults to info
