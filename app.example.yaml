# copy to app.yaml next to the pterodactylBackup executable
# account API key of a root admin, application keys (ptla_) are rejected by the client API
api_key: ptlc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
base_url: https://panel.example.com
# debug, info, warn or error, defaults to info
log_level: info
# skip servers whose newest successful backup is younger than this, 0 always backs up, defaults to 720 (12 hours)
min_backup_interval_minutes: 720
